<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Test</h1>
    <p>Testing: GET http://127.0.0.1:8000/api/intake/assessments/dashboard</p>
    <button onclick="testAPI()">Test API</button>
    <pre id="result"></pre>

    <script>
        async function testAPI() {
            const resultEl = document.getElementById('result');
            resultEl.innerHTML = 'Testing...';
            
            try {
                // Test 1: Without token
                resultEl.innerHTML += '\n\n=== Test 1: No token ===\n';
                let resp = await fetch('http://127.0.0.1:8000/api/intake/assessments/dashboard');
                resultEl.innerHTML += `Status: ${resp.status} ${resp.statusText}\n`;
                resultEl.innerHTML += `Response: ${await resp.text()}\n`;
                
                // Test 2: With dummy token
                resultEl.innerHTML += '\n\n=== Test 2: With token ===\n';
                const token = localStorage.getItem('token');
                if (token) {
                    resp = await fetch('http://127.0.0.1:8000/api/intake/assessments/dashboard', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    resultEl.innerHTML += `Status: ${resp.status} ${resp.statusText}\n`;
                    resultEl.innerHTML += `Response: ${await resp.text()}\n`;
                } else {
                    resultEl.innerHTML += 'No token in localStorage\n';
                }
            } catch (e) {
                resultEl.innerHTML += `Error: ${e.message}\n`;
            }
        }
    </script>
</body>
</html>
